name: Deploy AsPromised to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild and verify static bundle
        shell: bash
        run: |
          cat \
            .deploy/site.b64.00 \
            .deploy/site.b64.01 \
            .deploy/site.b64.02 \
            .deploy/site.b64.03 \
            .deploy/site.b64.04 \
            .deploy/site.b64.05 \
            .deploy/site.b64.06 \
            .deploy/site.b64.07 \
            .deploy/site.b64.08part0 \
            .deploy/site.b64.08part1 \
            .deploy/site.b64.08p2x0 \
            .deploy/site.b64.08p2x1 \
            .deploy/site.b64.08p2x2 \
            .deploy/site.b64.08p2x3 > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          echo '407ba8c69cf459d575cfc14b8945da297fdb8c457c6bb938b7bf30fb2e047a7e  /tmp/site.zip' | sha256sum -c -
          unzip -q /tmp/site.zip -d .
          test -f site/index.html
          test -f site/src/core.js
          grep -q 'kontormakker@gmail.com' site/src/config.js

          python3 .deploy/kiss_ui.py site
          node --check site/app.js
          node --check site/sw.js
          node --input-type=module -e "import('./site/src/benchmark.js').then(({runDeterministicBenchmark})=>{const r=runDeterministicBenchmark(); if(!r.passed) process.exit(1); console.log('benchmark '+r.passedCount+'/'+r.total)})"
          grep -q '1. Det du blev lovet' site/index.html
          grep -q '2. Det der skete' site/index.html
          grep -q '3. Se forskellen' site/index.html
          grep -q 'Flere muligheder' site/index.html
          ! grep -q 'lokalt · ingen betalt API' site/index.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          text = p.read_text(encoding='utf-8')
          token = '<meta name="google-site-verification" content="QB8po67xqtfQHReYX_3n-fyETPS1cFNOddzoTIGPiss" />'
          if token not in text:
              text = text.replace('<head>', '<head>\n  ' + token, 1)
              p.write_text(text, encoding='utf-8')
          PY
          grep -q 'QB8po67xqtfQHReYX_3n-fyETPS1cFNOddzoTIGPiss' site/index.html
          INDEXNOW_KEY='8e7f6d1c0a4b9f2e7d3c6a1b5e8f0d24'
          printf '%s' "$INDEXNOW_KEY" > "site/${INDEXNOW_KEY}.txt"
          test -f "site/${INDEXNOW_KEY}.txt"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test public site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in $(seq 1 12); do
              if curl -fsSL "$url" -o "$output"; then
                return 0
              fi
              sleep 5
            done
            echo "Public smoke test failed for $url" >&2
            return 1
          }

          base="${PAGE_URL%/}/"
          fetch_with_retry "$base" /tmp/public-index.html
          fetch_with_retry "${base}handvaerker-dyrere-end-tilbud/" /tmp/public-problem.html
          fetch_with_retry "${base}privatliv/" /tmp/public-privacy.html
          fetch_with_retry "${base}src/config.js" /tmp/public-config.js
          fetch_with_retry "${base}sitemap.xml" /tmp/public-sitemap.xml
          fetch_with_retry "${base}robots.txt" /tmp/public-robots.txt
          fetch_with_retry "${base}8e7f6d1c0a4b9f2e7d3c6a1b5e8f0d24.txt" /tmp/indexnow-key.txt

          grep -q 'AsPromised' /tmp/public-index.html
          grep -q '1. Det du blev lovet' /tmp/public-index.html
          grep -q '2. Det der skete' /tmp/public-index.html
          grep -q '3. Se forskellen' /tmp/public-index.html
          grep -q 'Flere muligheder' /tmp/public-index.html
          ! grep -q 'lokalt · ingen betalt API' /tmp/public-index.html
          grep -qi 'håndværker' /tmp/public-problem.html
          grep -qi 'privatliv' /tmp/public-privacy.html
          grep -q 'kontormakker@gmail.com' /tmp/public-config.js
          grep -q 'QB8po67xqtfQHReYX_3n-fyETPS1cFNOddzoTIGPiss' /tmp/public-index.html
          grep -q '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' /tmp/public-sitemap.xml
          grep -q 'https://kontormakker.github.io/Aspromised/' /tmp/public-sitemap.xml
          grep -q 'Sitemap: https://kontormakker.github.io/Aspromised/sitemap.xml' /tmp/public-robots.txt
          grep -q '^8e7f6d1c0a4b9f2e7d3c6a1b5e8f0d24$' /tmp/indexnow-key.txt

          echo "Public Pages smoke test passed: $base"
      - name: Notify IndexNow
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/indexnow.json
          import json, xml.etree.ElementTree as ET
          key = '8e7f6d1c0a4b9f2e7d3c6a1b5e8f0d24'
          root = ET.parse('site/sitemap.xml').getroot()
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [e.text.strip() for e in root.findall('s:url/s:loc', ns) if e.text]
          payload = {
              'host': 'kontormakker.github.io',
              'key': key,
              'keyLocation': f'https://kontormakker.github.io/Aspromised/{key}.txt',
              'urlList': urls,
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json \
              https://api.indexnow.org/indexnow || true)
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then
              echo "IndexNow accepted AsPromised URLs (HTTP $code)"
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "IndexNow notification did not succeed after retries (last HTTP $code). Site deployment remains valid." >&2
          exit 0
