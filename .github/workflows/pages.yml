name: Deploy AsPromised to Pages

on:
  push:
    branches:
      - main
      - agent/public-release
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild static bundle
        shell: bash
        run: |
          cat .deploy/site.b64.* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          unzip -q /tmp/site.zip -d .
          test -f site/index.html
          test -f site/src/core.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
