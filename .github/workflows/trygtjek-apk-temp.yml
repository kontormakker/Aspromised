name: Temporary TrygTjek APK Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trygtjek-apk-temp.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TrygTjek build payload
        uses: actions/checkout@v4
        with:
          ref: trygtjek-apk-source
          path: payload

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Restore and verify TrygTjek source
        shell: bash
        run: |
          cat payload/.trygtjek-build/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/trygtjek.zip
          echo "9491d3fe8f7f66b5c37cef9822752d0d795d5aff0177f3a19302b64d1f8a29ec  /tmp/trygtjek.zip" | sha256sum -c -
          unzip -q /tmp/trygtjek.zip -d "$RUNNER_TEMP"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/trygtjek-android-v0.1
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrygTjek-v0.1-debug-apk
          path: ${{ runner.temp }}/trygtjek-android-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
