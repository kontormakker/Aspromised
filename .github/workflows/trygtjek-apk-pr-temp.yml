name: Build TrygTjek Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trygtjek-apk-manual
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TrygTjek source payload
        uses: actions/checkout@v4
        with:
          ref: trygtjek-apk-source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Restore and verify TrygTjek source
        shell: bash
        run: |
          cat .trygtjek-build/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/trygtjek.zip
          echo "9491d3fe8f7f66b5c37cef9822752d0d795d5aff0177f3a19302b64d1f8a29ec  /tmp/trygtjek.zip" | sha256sum -c -
          unzip -q /tmp/trygtjek.zip -d "$RUNNER_TEMP"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/trygtjek-android-v0.1
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK="$RUNNER_TEMP/trygtjek-android-v0.1/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Publish temporary APK branch
        shell: bash
        run: |
          APK="$RUNNER_TEMP/trygtjek-android-v0.1/app/build/outputs/apk/debug/app-debug.apk"
          git config user.name "TrygTjek Build Bot"
          git config user.email "actions@github.com"
          git checkout --orphan trygtjek-apk-output-work
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p build-output
          cp "$APK" build-output/TrygTjek-v0.1-debug.apk
          sha256sum build-output/TrygTjek-v0.1-debug.apk > build-output/SHA256.txt
          printf 'TrygTjek Android V0.1 debug build\n' > build-output/README.txt
          git add build-output
          git commit -m "Publish temporary TrygTjek debug APK"
          git push --force origin HEAD:trygtjek-apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrygTjek-v0.1-debug-apk
          path: ${{ runner.temp }}/trygtjek-android-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
