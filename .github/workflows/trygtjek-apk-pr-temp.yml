name: Build TrygTjek Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trygtjek-apk-manual
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TrygTjek source payload
        uses: actions/checkout@v4
        with:
          ref: trygtjek-apk-source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore and patch TrygTjek source
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/trygtjek-report"
          {
            cat .trygtjek-build/part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/trygtjek.zip
            echo "9491d3fe8f7f66b5c37cef9822752d0d795d5aff0177f3a19302b64d1f8a29ec  /tmp/trygtjek.zip" | sha256sum -c -
            unzip -q /tmp/trygtjek.zip -d "$RUNNER_TEMP"
            BUILD="$RUNNER_TEMP/trygtjek-android-v0.1/app/build.gradle.kts"
            sed -i 's/compileSdk = 37/compileSdk = 36/' "$BUILD"
            sed -i 's/compose-bom:2026.08.00/compose-bom:2025.08.00/' "$BUILD"
            sed -i 's/androidx.core:core-ktx:1.19.0/androidx.core:core-ktx:1.17.0/' "$BUILD"
            sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.11.0/' "$BUILD"
            grep -nE 'compileSdk|compose-bom|core-ktx|activity-compose' "$BUILD"
          } 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/restore.log"

      - name: Install Android SDK packages
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/trygtjek-report"
          {
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          } 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/sdk.log"

      - name: Build debug APK
        id: build
        if: steps.restore.outcome == 'success' && steps.sdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/trygtjek-android-v0.1
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/build.log"

      - name: Validate APK
        id: validate
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          APK="$RUNNER_TEMP/trygtjek-android-v0.1/app/build/outputs/apk/debug/app-debug.apk"
          {
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            sha256sum "$APK"
          } 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/validate.log"

      - name: Publish APK or failure report
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/trygtjek-report"
          mkdir -p "$REPORT"
          {
            echo "restore=${{ steps.restore.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
          } > "$REPORT/STATUS.txt"

          APK="$RUNNER_TEMP/trygtjek-android-v0.1/app/build/outputs/apk/debug/app-debug.apk"
          if [ -s "$APK" ]; then
            cp "$APK" "$REPORT/TrygTjek-v0.1-debug.apk"
            sha256sum "$REPORT/TrygTjek-v0.1-debug.apk" > "$REPORT/SHA256.txt"
          fi

          git config user.name "TrygTjek Build Bot"
          git config user.email "actions@github.com"
          git checkout --orphan trygtjek-apk-output-work
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p build-output
          cp -a "$REPORT"/. build-output/
          git add build-output
          git commit -m "Publish TrygTjek APK build result"
          git push --force origin HEAD:trygtjek-apk-output

      - name: Upload APK artifact
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrygTjek-v0.1-debug-apk
          path: ${{ runner.temp }}/trygtjek-report/TrygTjek-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow if APK was not built
        if: steps.validate.outcome != 'success'
        shell: bash
        run: exit 1
