name: Build TrygTjek Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trygtjek-apk-manual
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TrygTjek source payload
        uses: actions/checkout@v4
        with:
          ref: trygtjek-apk-source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore and verify TrygTjek V0.3 source
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/trygtjek-report"
          {
            cat .trygtjek-build/part0[1-9].b64 | tr -d '\n\r ' | base64 -d > /tmp/trygtjek.zip
            echo "b3499c1150092cb779c11f273d63d7b3c099a5b33c4dbcee8df5ce85b63b89b6  /tmp/trygtjek.zip" | sha256sum -c -
            unzip -t /tmp/trygtjek.zip >/dev/null
            unzip -q /tmp/trygtjek.zip -d "$RUNNER_TEMP"
            BUILD="$RUNNER_TEMP/trygtjek-android-v0.3/app/build.gradle.kts"
            grep -nE 'compileSdk|targetSdk|versionCode|versionName|compose-bom|core-ktx|activity-compose|text-recognition|barcode-scanning' "$BUILD"
          } 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/restore.log"

      - name: Install Android SDK packages
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/trygtjek-report"
          {
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          } 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/sdk.log"

      - name: Build debug APK
        id: build
        if: steps.restore.outcome == 'success' && steps.sdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: ${{ runner.temp }}/trygtjek-android-v0.3
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/build.log"

      - name: Sign beta APK with stable test key
        id: sign
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          REPORT="$RUNNER_TEMP/trygtjek-report"
          KS="$RUNNER_TEMP/trygtjek-beta-test.keystore"
          INPUT="$RUNNER_TEMP/trygtjek-android-v0.3/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT="$REPORT/TrygTjek-v0.3-beta.apk"
          {
            base64 -d .trygtjek-build/test-signing-keystore.b64 > "$KS"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KS" \
              --ks-key-alias trygtjekbeta \
              --ks-pass pass:'TrygTjekBeta2026!' \
              --key-pass pass:'TrygTjekBeta2026!' \
              --out "$OUTPUT" \
              "$INPUT"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$OUTPUT"
          } 2>&1 | tee "$REPORT/sign.log"

      - name: Validate APK
        id: validate
        if: steps.sign.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          APK="$RUNNER_TEMP/trygtjek-report/TrygTjek-v0.3-beta.apk"
          {
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
            sha256sum "$APK"
          } 2>&1 | tee "$RUNNER_TEMP/trygtjek-report/validate.log"

      - name: Publish APK or failure report
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/trygtjek-report"
          mkdir -p "$REPORT"
          echo "$GITHUB_RUN_ID" > "$REPORT/RUN_ID.txt"
          {
            echo "version=0.3.0"
            echo "restore=${{ steps.restore.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "sign=${{ steps.sign.outcome }}"
            echo "validate=${{ steps.validate.outcome }}"
          } > "$REPORT/STATUS.txt"

          APK="$REPORT/TrygTjek-v0.3-beta.apk"
          if [ -s "$APK" ]; then
            sha256sum "$APK" > "$REPORT/SHA256.txt"
          fi

          git config user.name "TrygTjek Build Bot"
          git config user.email "actions@github.com"
          git checkout --orphan trygtjek-apk-output-work
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p build-output
          cp -a "$REPORT"/. build-output/
          git add build-output
          git commit -m "Publish TrygTjek V0.3 APK build result"
          git push --force origin HEAD:trygtjek-apk-output

      - name: Upload APK artifact
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrygTjek-v0.3-beta-apk
          path: ${{ runner.temp }}/trygtjek-report/TrygTjek-v0.3-beta.apk
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow if APK was not built
        if: steps.validate.outcome != 'success'
        shell: bash
        run: exit 1
